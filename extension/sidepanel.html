<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delft Browser</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header>
  <div class="toolbar">
    <label class="voice">Voice
      <select id="voice">
        <option value="nl-NL-MaartenNeural" selected>Maarten (NL, m)</option>
        <option value="nl-NL-FennaNeural">Fenna (NL, f)</option>
        <option value="nl-NL-ColetteNeural">Colette (NL, f)</option>
        <option value="nl-BE-DenaNeural">Dena (BE, f)</option>
      </select>
    </label>
    <button id="reload" title="Reload the article from the current tab">↻</button>
  </div>
  <div class="status" id="status" hidden></div>
</header>
<main>
  <div id="article-title" class="article-title"></div>
  <ol id="sentences" class="sentences"></ol>
  <div id="empty" class="empty">Open a Dutch article in this tab and it will appear here.</div>
</main>
<div id="tooltip" class="tooltip" hidden></div>
<script src="lib/splitter.js"></script>
<script src="lib/dictionary.js"></script>
<script src="lib/glosses.js"></script>
<script src="lib/edgetts.js"></script>
<script src="lib/audiocache.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
